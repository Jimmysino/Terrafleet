name: deploy
on:
  push:
    branches: [development]
permissions:
  contents: read
  id-token: write
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: |
          terraform -chdir=terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=lab09/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Terraform Validate
        run: terraform -chdir=terraform validate
      - name: Terraform Plan
        run: terraform -chdir=terraform plan -out=tfplan
      - name: Import existing Lambdas
        run: |
          terraform -chdir=terraform import aws_lambda_function.buscar_equipos lab09-buscar-equipos || true
          terraform -chdir=terraform import aws_lambda_function.ver_disponibilidad lab09-ver-disponibilidad || true
          terraform -chdir=terraform import aws_lambda_function.publicar_equipo lab09-publicar-equipo || true
          terraform -chdir=terraform import aws_lambda_function.subir_foto lab09-subir-foto || true
          terraform -chdir=terraform import aws_lambda_function.crear_reserva lab09-crear-reserva || true
      - name: Terraform Apply
        run: terraform -chdir=terraform apply -auto-approve tfplan